<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RL Overlay Studio · Beta 8.46</title><style>body{margin:0;min-height:100vh;background:#080d17;color:#eef5ff;display:grid;place-items:center;font-family:system-ui,Arial,sans-serif}.load{text-align:center;width:min(460px,90vw)}.bar{height:5px;border-radius:4px;background:#29384e;overflow:hidden}.bar i{height:100%;width:0;background:#8c70ff;display:block;transition:width .22s}.err{color:#ff9da9}</style></head><body><div class="load"><h1>RL Overlay Studio · Beta 8.46</h1><p id="msg">Chargement des présentations et animations authentiques…</p><div class="bar"><i id="progress"></i></div></div><script>(async()=>{const total=43,results=new Array(total);let done=0;const base='showcase_data/part_';try{await Promise.all(Array.from({length:total},async(_,i)=>{const n=String(i).padStart(3,'0');const r=await fetch(base+n+'.txt');if(!r.ok)throw Error('Fichier manquant : '+n+' (HTTP '+r.status+')');results[i]=await r.text();document.getElementById('progress').style.width=(++done/total*100).toFixed(0)+'%';}));const html=results.join('');if(html.length<9000000||!html.startsWith('<!doctype html>'))throw Error('Données de présentation incomplètes');document.open();document.write(html);document.close();}catch(e){document.getElementById('msg').className='err';document.getElementById('msg').textContent='Impossible de charger les médias : '+e.message+'. Télécharge la version HTML autonome.';console.error(e);}})();</script></body></html>
