name: Export Beta 8.46 static README captures
on:
  push:
    branches: [main]
    paths: [.github/workflows/export-readme-captures.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode existing presentation screenshots to standalone PNG files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, re, unicodedata
          parts = sorted(Path('docs/showcase_data').glob('part_*.txt'))
          assert len(parts) == 43, f'Unexpected source parts: {len(parts)}'
          html = ''.join(p.read_text(encoding='utf-8') for p in parts)
          marker = 'const CATALOG='
          assert marker in html, 'Media catalog not found'
          data, _ = json.JSONDecoder().raw_decode(html[html.index(marker)+len(marker):])
          expected = {'application_ui': 5, 'overlay_banner': 18,
                      'overlay_vertical': 1, 'overlay_horizontal': 1,
                      'premium_rank_tower': 1, 'players_mmr': 3,
                      'showmatch': 4, 'ingame_dock': 7}
          assert {name:len(item['states']) for name,item in data.items()} == expected
          dest = Path('media/readme/captures')
          dest.mkdir(parents=True, exist_ok=True)
          saved = []
          for key, view in data.items():
              if key == 'ingame_dock':
                  continue
              for i, state in enumerate(view['states']):
                  slug = unicodedata.normalize('NFKD', state['label']).encode('ascii','ignore').decode().lower()
                  slug = re.sub(r'[^a-z0-9]+', '_', slug).strip('_')
                  name = f'{key}_{i:02d}_{slug}.png'
                  source = state['image']
                  assert source.startswith('data:image/png;base64,'), name
                  raw = base64.b64decode(source.split(',',1)[1], validate=True)
                  assert raw[:8] == b'\x89PNG\r\n\x1a\n', name
                  (dest/name).write_bytes(raw)
                  saved.append(str(dest/name))
          assert len(saved) == 33, f'Unexpected exported count: {len(saved)}'
          print(f'Exported {len(saved)} source-derived static PNG screenshots')
          PY
      - name: Commit exported images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/readme/captures/
          git diff --staged --quiet || (git commit -m 'docs: export authentic Beta 8.46 static README screenshots' && git push)
