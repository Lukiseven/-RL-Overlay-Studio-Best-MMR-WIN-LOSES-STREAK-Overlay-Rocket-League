name: Prepare transparent presentation assets
on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/prepare-presentation-assets.yml"
      - "tools/prepare_presentation_assets.py"
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Build transparent previews and Pages assets
        run: python tools/prepare_presentation_assets.py
      - name: Commit generated presentation assets
        run: |
          git config user.name "RL Overlay Studio"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Prepare transparent previews for Live HTML demos"
            git push origin HEAD:main
          fi
